<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akun</title>
    <link rel="stylesheet" href="account.css">
    <link rel="stylesheet" href="navbar.css">
</head>

<body>

    <div class="account-container">

        <div class="account-header">
            <h2>Akun</h2>
        </div>

        <div class="account-content">

            <!-- RINGKASAN PROFIL: cuma tampilan, buat edit beneran
                 klik ikon pensil -> pindah ke halaman edit-profile.html -->
            <div class="profile-card">

                <div class="avatar-circle" id="avatarInitial">?</div>

                <div class="profile-info">
                    <h3 id="profileNameText">Belum ada nama</h3>
                    <p id="profilePhoneText">Nomor HP belum diisi</p>
                </div>

                <a href="edit-profile.html" class="edit-icon-btn" title="Edit Profil">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
                    </svg>
                </a>

            </div>

            <!-- MENU UTAMA -->
            <div class="menu-list">

                <a href="address.html" class="menu-item">
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    <span class="menu-label">Alamat Saya</span>
                    <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </a>

                <button class="menu-item" id="changePasswordBtn" type="button">
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <span class="menu-label">Ubah Kata Sandi</span>
                    <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>

                <button class="menu-item" id="helpBtn" type="button">
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span class="menu-label">Pusat Bantuan</span>
                    <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                </button>

                <button class="menu-item danger" id="logoutBtn" type="button">
                    <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span class="menu-label">Keluar</span>
                </button>

            </div>

            <!-- UBAH KATA SANDI (decoy) & PUSAT BANTUAN: disembunyikan
                 default, muncul kalau menu di atas diklik -->
            <div class="account-section" id="changePasswordSection" style="display:none;">
                <h3>Ubah Kata Sandi</h3>
                <label>Kata Sandi Lama</label>
                <input type="password" id="oldPasswordInput" placeholder="Kata sandi saat ini">
                <label>Kata Sandi Baru</label>
                <input type="password" id="newPasswordInput" placeholder="Kata sandi baru">
                <button class="save-btn" id="savePasswordBtn">Simpan Kata Sandi</button>
                <p class="save-msg" id="passwordSavedMsg">Kata sandi berhasil diperbarui ✔</p>
            </div>

            <div class="account-section" id="helpSection" style="display:none;">
                <h3>Pusat Bantuan</h3>
                <p class="hint">Butuh bantuan? Hubungi tim kami di bawah ini.</p>
                <p class="hint">📧 support@foodie-demo.com</p>
                <p class="hint">📞 0800-1234-5678 (Senin–Jumat, 09.00–17.00)</p>
            </div>

            <!-- STATUS PESANAN -->
            <div class="account-section" id="statusPesanan">
                <h3>Status Pesanan</h3>
                <div id="orderList"></div>
            </div>

        </div>

    </div>

    <div id="bottomNav"></div>

    <script src="account.js"></script>
    <script src="navbar.js"></script>

</body>
</html>
